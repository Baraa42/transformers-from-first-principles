seed: 42
device: auto

data:
  dataset_name: karpathy/tinystories-gpt4-clean
  tokenizer_repo: fracagnetta/tinystories.BPE8192
  train_stories: 20000
  val_stories: 1000
  context_length: 128
  batch_size: 16
  num_workers: 0
  pin_memory: false

model:
  d_model: 128
  n_heads: 4
  d_ff: 512
  n_layers: 4

training:
  steps: 2000
  learning_rate: 0.0003
  weight_decay: 0.01
  precision: fp32
  grad_accum_steps: 1
  max_grad_norm: 1.0
  eval_interval: 100
  log_interval: 10
  eval_batches: 20
  checkpoint_interval: 500
  checkpoint_dir: checkpoints
